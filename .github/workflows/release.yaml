name: Release CLI

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix packages/workspaces ci
      - run: npm --prefix packages/workspaces run build
      - name: Install matching WASM bindings generator
        run: |
          tress_bindgen_version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$tress_bindgen_version" --locked
      - run: npm --prefix site run wasm:node
      - run: npm --prefix packages/client ci
      - run: npm --prefix packages/client run build
      - run: npm --prefix packages/client test
      - run: npm --prefix packages/harness-host ci
      - run: npm --prefix packages/harness-host run build
      - run: cargo build --locked -p tress
        env:
          TRESS_EMBED_RUNTIME: "1"
      - run: npm --prefix packages/harness-host test
        env:
          TRESS_TEST_BINARY: ${{ github.workspace }}/target/debug/tress
          TRESS_TEST_EMBEDDED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-host-runtime
          path: packages/harness-host/dist
          if-no-files-found: error

  build:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: harness-host-runtime
          path: packages/harness-host/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["workspace"]["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match Cargo.toml version"
          PY
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test installer
        run: node --test site/scripts/install.test.mjs
      - run: cargo test --locked -p tress
      - name: Build release binary
        env:
          TRESS_EMBED_RUNTIME: "1"
          CC: ${{ runner.os == 'Linux' && 'musl-gcc' || 'cc' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release -p tress --target ${{ matrix.target }}
      - name: Smoke test and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/verify-cli-release.py "target/$TARGET/release/tress"
          python3 scripts/test-setup-pty.py "target/$TARGET/release/tress"
          mkdir dist
          cp "target/$TARGET/release/tress" "dist/tress-$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: tress-${{ matrix.target }}
          path: dist/tress-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tress-*
          merge-multiple: true
          path: dist
      - name: Publish binaries and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum tress-* > SHA256SUMS
          gh release create "$RELEASE_TAG" tress-* SHA256SUMS --verify-tag --generate-notes
