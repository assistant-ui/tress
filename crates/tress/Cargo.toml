[package]
name = "tress"
description = "Tiny coding agent whose session is a thread: terminal-native, embeddable, built on the harness-sdk protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["agent", "cli", "ai", "assistant-ui", "harness-sdk"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }

[[bin]]
name = "tress"
path = "src/main.rs"
