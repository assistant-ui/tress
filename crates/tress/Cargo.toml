[package]
name = "tress"
description = "Tiny coding agent whose session is a thread: terminal-native, embeddable, built on the harness-sdk protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["agent", "cli", "ai", "assistant-ui", "harness-sdk"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The HTTP transport and the terminal binary are native-only; the core
# (engine, tools, message assembly) compiles for wasm32 without them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
statewire = { version = "0.1.0", features = ["http"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"

[[bin]]
name = "tress"
path = "src/main.rs"
required-features = []
